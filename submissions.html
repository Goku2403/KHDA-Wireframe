<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHDA</title>
  <meta name="application-name" content="KHDA">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260926n">
  <meta name="theme-color" content="#A8305C">
  <link rel="stylesheet" href="css/khda.css?v=20260926n">
</head>
<body class="on-canvas">

  <!-- ===== Portal header ===== -->
  <header class="portal-header">
    <div class="portal-header__inner">
      <div class="portal-header__top">
        <a class="brand-gov" href="#" aria-label="Government of Dubai">
          <img src="assets/gov-dubai.svg" width="129" height="51" alt="Government of Dubai">
        </a>
        <a class="brand-khda" href="#" aria-label="Dubai Knowledge">
          <img src="assets/khda-logo.svg?v=20260926n" width="85" height="44" alt="Dubai Knowledge">
        </a>
      </div>
      <div class="portal-header__sub">
        <nav class="portal-nav" aria-label="Portal">
          <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <a href="submissions.html" aria-current="page" data-i18n="nav.submissions">Submissions</a>
        </nav>
        <div class="portal-tools">
          <button class="tool-pill tool-pill--demo" type="button" id="demoToggle" aria-pressed="false" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
            <span id="demoToggleLabel">Demo data</span>
          </button>
          <button class="tool-pill tool-pill--icon" type="button" aria-label="Accessibility" data-i18n-aria="tool.accessibility">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4" r="2"/><path d="M4 9h16M12 9v6m0 0-3 6m3-6 3 6"/></svg>
          </button>
          <button class="tool-pill tool-pill--lang" type="button" id="langToggle" data-i18n="tool.lang" data-i18n-aria="tool.langAria">العربية</button>
          <div class="tool-account">
            <button class="tool-pill tool-user" type="button" id="userPill" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
              <span class="tool-user__avatar" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              </span>
              <span class="tool-user__text">
                <span class="tool-user__role" data-i18n="user.role">Institution Admin</span>
                <span class="tool-user__name" data-i18n="user.name">Noura Al Khatib</span>
              </span>
              <svg class="tool-user__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="user-menu" id="userMenu" role="menu" aria-label="Account menu" data-i18n-aria="user.menu" hidden>
              <button class="user-menu__logout" type="button" id="btnLogout" role="menuitem">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg>
                <span data-i18n="user.logout">Log out</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page page--catalogue">


    <!-- Hero: title + search -->
    <section class="hero">
      <h1 class="hero__title" data-i18n="cat.title">Submissions</h1>
      <label class="find">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="catSearch" placeholder="Find a dataset" data-i18n-ph="cat.find" aria-label="Find a dataset" data-i18n-aria="cat.find">
      </label>
      <div class="or-divider"><span data-i18n="cat.or">or</span></div>
      <div class="toggle-pills" role="group" aria-label="Filter datasets">
        <button class="pill pill--on" type="button" data-scope="all" aria-pressed="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
          <span data-i18n="cat.allDatasets">All datasets</span>
        </button>
        <button class="pill" type="button" data-scope="fav" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
          <span data-i18n="cat.favourites">Favourites</span>
        </button>
      </div>
    </section>

    <!-- Results -->
    <section class="results">
      <div class="results__head">
        <h2 class="results__count" id="catCount">Showing 0 datasets</h2>
        <div class="results__tools">
          <div class="view-toggle" role="group" aria-label="View" id="catView">
            <button type="button" data-view="cards" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>Cards</button>
            <button type="button" data-view="table" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Table</button>
          </div>
          <label class="results__sort" id="catGroupWrap" hidden>
            <span class="sr-only">Group by</span>
            <select class="control control--select control--sort" id="catGroup">
              <option value="area">Group by subject area</option>
              <option value="frequency">Group by frequency</option>
              <option value="none">All datasets</option>
            </select>
          </label>
          <label class="results__sort" id="catStatusWrap" hidden>
            <span class="sr-only">Status</span>
            <select class="control control--select control--sort" id="catStatus">
              <option value="all">All statuses</option>
              <option value="not_started">Not started</option>
              <option value="in_pipeline">In pipeline</option>
              <option value="needs_correction">Needs correction</option>
              <option value="accepted">Accepted</option>
              <option value="overdue">Overdue</option>
            </select>
          </label>
          <button class="btn btn--outline btn--sm" type="button" id="exportAll">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0-4-4m4 4 4-4M4 16v4h16v-4"/></svg>
            <span data-i18n="dash.export.button">Export everything</span>
          </button>
          <label class="results__sort">
            <span class="sr-only">Sort datasets</span>
            <select class="control control--select control--sort" id="catSort">
              <option value="az" data-i18n="cat.sortAz">Sort by A-Z</option>
              <option value="za" data-i18n="cat.sortZa">Sort by Z-A</option>
              <option value="fields" data-i18n="cat.sortFields">Sort by most fields</option>
            </select>
          </label>
        </div>
      </div>

      <div class="card-grid" id="catGrid"></div>
      <div class="cat-groups" id="catTable" hidden></div>

      <div class="empty" id="catEmpty" hidden>
        <div class="empty__title" data-i18n="cat.none">No datasets found</div>
        <div class="empty__text" data-i18n="cat.noneText">Try a different search, or switch back to all datasets.</div>
      </div>

      <div class="results__foot" id="catFoot">
        <span class="results__info" id="catInfo"></span>
        <div class="pager" id="catPager"></div>
      </div>
    </section>
  </main>

  <!-- Toasts -->
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <!-- Dataset details modal -->
  <div class="modal-backdrop sheet-backdrop" id="detailsModal" hidden>
    <aside class="sheet sheet--wide" role="dialog" aria-modal="true" aria-labelledby="detailsTitle">
      <div class="sheet__body">
        <div class="sheet__head">
          <h3 class="sheet__title" id="detailsTitle" style="font-size:32px;line-height:40px"></h3>
          <button class="icon-btn sheet__close" type="button" id="detailsClose" aria-label="Close" data-i18n-aria="common.close">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <p class="sheet__sub" id="detailsSub"></p>
        <div class="sheet__meta" id="detailsMeta"></div>
        <div class="tabs" id="detailsTabs" role="tablist">
          <button type="button" role="tab" data-tab="spec" aria-selected="true">Specification</button>
          <button type="button" role="tab" data-tab="subs" aria-selected="false">Submissions</button>
          <button type="button" role="tab" data-tab="issues" aria-selected="false">Issues <span class="count-badge" id="detailsIssueCount">0</span></button>
          <button type="button" role="tab" data-tab="journey" aria-selected="false">Journey</button>
        </div>
        <div class="field-list" id="detailsFields"></div>
      </div>

      <div class="sheet__actions">
        <div class="sheet__actions-right">
          <button class="btn btn--outline" type="button" id="detailsReport" data-i18n="cat.report">View data report</button>
          <button class="btn btn--primary" type="button" id="detailsStart" data-i18n="cat.start">Start submission</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Choosing how to submit: two cards over the blurred catalogue -->
  <div class="choose-overlay" id="chooseOverlay" hidden>
    <div class="choose-card" role="dialog" aria-modal="true" aria-labelledby="chooseTitle">
      <div class="choose-head">
        <h2 class="choose-title" id="chooseTitle" data-i18n="mode.title">Before we start, choose how to submit</h2>
        <p class="choose-sub" id="chooseSub"></p>
      </div>

      <div class="choice-grid" id="choiceGrid">
        <button class="choice" type="button" data-mode="bulk">
          <span class="choice__art" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 3v5h5M7 3h7l5 5v13H7z"/><path d="M12 18v-6m-2.5 2.5L12 12l2.5 2.5"/></svg>
          </span>
          <span class="choice__text">
            <span class="choice__label" data-i18n="mode.bulk">Bulk upload</span>
            <span class="choice__hint" data-i18n="mode.bulkHint">Fill the Excel template and drop the file in to load every record at once.</span>
          </span>
        </button>
        <button class="choice" type="button" data-mode="form">
          <span class="choice__art" aria-hidden="true">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
          </span>
          <span class="choice__text">
            <span class="choice__label" data-i18n="mode.form">Form submission</span>
            <span class="choice__hint" data-i18n="mode.formHint">Type records one at a time into a guided form with live validation.</span>
          </span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/i18n.js?v=20260926n"></script>
  <script src="js/a11y.js?v=20260926n"></script>
  <script src="js/activity.js?v=20260926n"></script>
  <script src="js/fit.js?v=20260926n"></script>
  <script src="js/lists.js?v=20260926n"></script>
  <script src="js/datasets.js?v=20260926n"></script>
  <script src="js/schema.js?v=20260926n"></script>
  <script src="js/model.js?v=20260926n"></script>
  <script src="js/portal.js?v=20260926n"></script>
  <script src="js/template.js?v=20260926n"></script>
  <script src="js/export.js?v=20260926n"></script>
  <script src="js/sector.js?v=20260926n"></script>
  <script src="js/roles.js?v=20260926n"></script>
  <script src="js/journey.js?v=20260926n"></script>
  <script src="js/chatbot.js?v=20260926n"></script>
  <script src="js/demo.js?v=20260926n"></script>
  <script src="js/choose.js?v=20260926n"></script>
  <script src="js/catalogue.js?v=20260926n"></script>
  <script src="js/shell.js?v=20260926n"></script>
</body>
</html>
