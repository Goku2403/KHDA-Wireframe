<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KHDA</title>
  <meta name="application-name" content="KHDA">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260926ze">
  <meta name="theme-color" content="#A8305C">
  <link rel="stylesheet" href="css/khda.css?v=20260926ze">
</head>
<body class="on-canvas on-canvas--admin" data-team="it">

  <!-- ===== Portal header ===== -->
  <header class="portal-header">
    <div class="portal-header__inner">
      <div class="portal-header__top">
        <a class="brand-gov" href="#" aria-label="Government of Dubai">
          <img src="assets/gov-dubai.svg" width="129" height="51" alt="Government of Dubai">
        </a>
        <a class="brand-khda" href="#" aria-label="Dubai Knowledge">
          <img src="assets/khda-logo.svg?v=20260926ze" width="85" height="44" alt="Dubai Knowledge">
        </a>
      </div>
      <div class="portal-header__sub">
        <nav class="portal-nav" aria-label="Portal">
          <a href="dashboard.html" data-i18n="nav.dashboard">Dashboard</a>
          <a href="submissions.html" data-i18n="nav.submissions">Submissions</a>
          <a href="governance.html" aria-current="page" data-i18n="nav.governance">Data Governance Policies</a>
          <a href="api-integration.html" data-i18n="nav.apiIntegration">API Integration</a>
        </nav>
        <div class="portal-tools">
          <button class="tool-pill tool-pill--demo" type="button" id="demoToggle" aria-pressed="false" hidden>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
            <span id="demoToggleLabel">Demo data</span>
          </button>
          <button class="tool-pill tool-pill--icon" type="button" aria-label="Accessibility" data-i18n-aria="tool.accessibility">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4" r="2"/><path d="M4 9h16M12 9v6m0 0-3 6m3-6 3 6"/></svg>
          </button>
          <button class="tool-pill tool-pill--lang" type="button" id="langToggle" data-i18n="tool.lang" data-i18n-aria="tool.langAria">العربية</button>
          <div class="tool-account">
            <button class="tool-pill tool-user" type="button" id="userPill" aria-haspopup="true" aria-expanded="false" aria-controls="userMenu">
              <span class="tool-user__avatar" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              </span>
              <span class="tool-user__text">
                <span class="tool-user__role" data-i18n="user.role">Institution Admin</span>
                <span class="tool-user__name" data-i18n="user.name">Noura Al Khatib</span>
              </span>
              <svg class="tool-user__chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="user-menu" id="userMenu" role="menu" aria-label="Account menu" data-i18n-aria="user.menu" hidden>
              <button class="user-menu__logout" type="button" id="btnLogout" role="menuitem">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg>
                <span data-i18n="user.logout">Log out</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page" id="main" tabindex="-1">
    <div class="service-header">
      <a class="back-link" href="governance.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <span data-i18n="cfg.back">Data Governance Policies</span>
      </a>
      <h1 data-i18n="cfg.title">Data Governance Rule Engine</h1>
      <p class="service-header__lede" data-i18n="cfg.lede">Define the validation rules applied to each dataset before submission.</p>
    </div>

    <!-- The dataset picker stands on its own; the summary it used to sit above now lives in a
         drawer behind "View details", so the authoring view starts at the top of the page. -->
    <div class="cfg-bar">
      <!-- A native select popped upward off-screen with 46 options, and the direction is the
           browser's to choose, so the dataset picker is a listbox that always opens below. -->
      <div class="cfg-picker" id="dsPicker">
        <span class="cfg-picker__label" id="dsLabel" data-i18n="cfg.dataset">Dataset</span>
        <button class="cfg-picker__btn" type="button" id="dsButton"
                aria-haspopup="listbox" aria-expanded="false" aria-labelledby="dsLabel dsButton">
          <span class="cfg-picker__value" id="dsValue"></span>
          <svg class="cfg-picker__chev" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="cfg-picker__panel" id="dsPanel" hidden>
          <label class="search cfg-picker__search">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="dsFilter" data-i18n-ph="cfg.searchDatasets" placeholder="Search datasets">
          </label>
          <ul class="cfg-picker__list" id="dsList" role="listbox" aria-labelledby="dsLabel"></ul>
        </div>
      </div>

      <div class="cfg-bar__actions">
        <span class="chip chip--complete" id="submittedChip" hidden data-i18n="cfg.submittedChip">submitted</span>
        <button class="link-icon" type="button" id="detailsBtn"
                aria-haspopup="dialog" aria-expanded="false" aria-controls="cfgDrawer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span data-i18n="cfg.viewDetails">View details</span>
        </button>
        <button class="link-icon" type="button" id="exportBtn" aria-haspopup="menu" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>
          <span data-i18n="cfg.export">Export rules</span>
        </button>
      </div>

      <!-- API_Code is still resolved, persisted and exported; it is just not surfaced -->
      <label class="cfg-ds cfg-ds--code" hidden>
        <span data-i18n="cfg.apiCode">API code</span>
        <span class="cfg-codewrap">
          <input type="text" id="apiCode" maxlength="100">
          <span class="chip chip--warning" id="apiCodeFlag" hidden
                data-i18n-title="cfg.unverifiedHint" data-i18n="cfg.unverified">unverified</span>
        </span>
      </label>
    </div>

    <div class="cfg-grid">
      <aside class="dash-card cfg-rail" aria-label="Fields">
        <div class="dash-card__head">
          <h2 class="dash-card__title" data-i18n="cfg.fields">Fields</h2>
          <span class="chip chip--neutral" id="fieldCount">0</span>
        </div>
        <label class="search">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="fieldSearch" data-i18n-ph="cfg.searchFields" placeholder="Search fields">
        </label>
        <div class="segmented" id="fieldFilter" role="group">
          <button type="button" data-f="all" aria-pressed="true" data-i18n="cfg.filter.all">All</button>
          <button type="button" data-f="has" aria-pressed="false" data-i18n="cfg.filter.has">Has rules</button>
          <button type="button" data-f="none" aria-pressed="false" data-i18n="cfg.filter.none">No rules</button>
        </div>
        <ul class="cfg-rail__list" id="fieldRail" role="listbox" aria-label="Fields" tabindex="0"></ul>
      </aside>
      <section class="dash-card cfg-pane" id="rulePane" aria-live="polite"></section>
    </div>

    <!-- the rules are authored above; the read-through before submitting closes the flow -->
    <div class="cfg-foot">
      <button class="btn btn--primary" type="button" id="previewBtn" data-i18n="cfg.preview">Preview rules</button>
    </div>

    <!-- the dataset summary, opened from "View details" -->
    <div class="cfg-drawer__scrim" id="cfgScrim" hidden></div>
    <aside class="cfg-drawer" id="cfgDrawer" role="dialog" aria-modal="true" aria-labelledby="cfgDrawerTitle" hidden>
      <div class="cfg-drawer__head">
        <h2 class="dash-card__title" id="cfgDrawerTitle" data-i18n="cfg.overview">Dataset overview</h2>
        <button class="icon-btn" type="button" id="cfgDrawerClose" data-i18n-aria="cfg.close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="cfg-drawer__body">
        <div class="cfg-tiles" id="cfgTiles"></div>
        <div class="cfg-head__charts" id="cfgCharts"></div>
      </div>
    </aside>

    <!-- the read-through before submitting, painted by config.js -->
    <section class="cfg-review" id="cfgReview" hidden></section>
  </main>

  <!-- Toasts -->
  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script src="js/i18n.js?v=20260926ze"></script>
  <script src="js/a11y.js?v=20260926ze"></script>
  <script src="js/activity.js?v=20260926ze"></script>
  <script src="js/fit.js?v=20260926ze"></script>
  <script src="js/lists.js?v=20260926ze"></script>
  <script src="js/datasets.js?v=20260926ze"></script>
  <script src="js/schema.js?v=20260926ze"></script>
  <script src="js/sector.js?v=20260926ze"></script>
  <script src="js/roles.js?v=20260926ze"></script>
  <script src="js/rule-model.js?v=20260926ze"></script>
  <script src="js/rowmenu.js?v=20260926ze"></script>
  <script src="js/demo.js?v=20260926ze"></script>
  <script src="js/config.js?v=20260926ze"></script>
</body>
</html>
