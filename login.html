<!DOCTYPE html>
<html lang="en" class="login-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — KHDA</title>
  <meta name="application-name" content="KHDA">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260927q">
  <meta name="theme-color" content="#A8305C">
  <link rel="stylesheet" href="css/khda.css?v=20260927q">
</head>
<body class="on-canvas login-page">

  <header class="portal-header">
    <div class="portal-header__inner">
      <div class="portal-header__top">
        <a class="brand-gov" href="#" aria-label="Government of Dubai">
          <img src="assets/gov-dubai.svg" width="129" height="51" alt="Government of Dubai">
        </a>
        <a class="brand-khda" href="#" aria-label="Dubai Knowledge">
          <img src="assets/khda-logo.svg?v=20260927q" width="85" height="44" alt="Dubai Knowledge">
        </a>
      </div>
      <div class="portal-header__sub login-sub">
        <span></span>
        <div class="portal-tools">
          <button class="tool-pill tool-pill--icon" type="button" aria-label="Accessibility" data-i18n-aria="tool.accessibility">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4" r="2"/><path d="M4 9h16M12 9v6m0 0-3 6m3-6 3 6"/></svg>
          </button>
          <button class="tool-pill tool-pill--lang" type="button" id="langToggle" data-i18n="tool.lang" data-i18n-aria="tool.langAria">العربية</button>
        </div>
      </div>
    </div>
  </header>

  <main class="login">
    <div class="login__stage" aria-hidden="true"><div class="hero-field" id="heroField"></div></div>
    <section class="login__card" data-hero-obstacle><span class="login__glow" aria-hidden="true"></span>
      <div class="small muted" data-i18n="login.portal">Higher-Education Data Portal</div>
      <h1 class="login__title" data-i18n="login.title">Knowledge and Human Development Authority</h1>
      <button class="login__btn" type="button" id="signIn">
        <img src="assets/uaepass.svg" width="30" height="29" alt="" aria-hidden="true">
        <span data-i18n="login.uaepass">Sign in with UAE PASS</span>
      </button>
      <div class="login__roles" role="group" aria-label="Sign in as" id="loginRoles">
        <span class="small muted" data-i18n="login.signInAs">Sign in as</span>
        <div class="segmented segmented--pill">
          <button type="button" data-role="inst" aria-pressed="true">Institution</button>
          <button type="button" data-role="khda" aria-pressed="false">KHDA</button>
          <button type="button" data-role="data" aria-pressed="false">KHDA Data</button>
          <button type="button" data-role="it" aria-pressed="false">KHDA IT</button>
        </div>
      </div>
      <p class="login__blurb" data-i18n="login.blurb">A single trusted digital identity for all citizens, residents and visitors.</p>
      <p class="login__register"><span data-i18n="login.noAccount">Don't have an account?</span> <a href="#" data-i18n="login.register">Register</a></p>
    </section>
  </main>

  <footer class="login__footer">
    <div class="login__footer-left">
      <img class="login__fi" src="assets/ui/happiness-meter.svg" width="32" height="32" alt="" aria-hidden="true">
      <span class="login__sep"></span>
      <img class="login__fi" src="assets/ui/sign-language.svg" width="32" height="32" alt="" aria-hidden="true">
      <span class="login__sep"></span>
      <a href="submissions.html" data-i18n="login.services">Services</a>
    </div>
    <div class="login__footer-right">
      <a class="login__contact" href="#"><img src="assets/ui/mail.svg" width="24" height="24" alt="" aria-hidden="true"><span data-i18n="login.contact">Contact Us</span></a>
      <span class="login__sep"></span>
      <img class="login__fi" src="assets/ui/dubai-ae.svg" width="84" height="15" alt="dubai.ae">
      <span class="login__sep"></span>
      <img class="login__fi" src="assets/ui/dubai-ai-a.svg" width="29" height="32" alt="AI">
      <span class="login__sep"></span>
      <img class="login__fi" src="assets/ui/chat-bot.svg" width="32" height="32" alt="" aria-hidden="true">
    </div>
  </footer>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <script src="js/i18n.js?v=20260927q"></script>
  <script src="js/a11y.js?v=20260927q"></script>
  <script src="js/vendor/matter.min.js" data-matter defer></script>
  <script src="js/roles.js?v=20260927q"></script>
  <script src="js/login.js?v=20260927q"></script>
  <script src="js/login-hero.js?v=20260927q"></script>
</body>
</html>
